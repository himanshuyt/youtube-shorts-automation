name: Daily Shorts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render a test video without uploading"
        required: true
        type: boolean
        default: true
  schedule:
    # 18:30 Asia/Kolkata (UTC+5:30). GitHub may delay scheduled workflows.
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Render test video
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: python main.py --dry-run

      - name: Generate and upload Short
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          SCHEDULE_PUBLIC: ${{ vars.SCHEDULE_PUBLIC }}
        run: python main.py

      - name: Commit topic history
        if: always()
        run: |
          if ! git diff --quiet -- storage/history.json; then
            git config user.name "shorts-automation[bot]"
            git config user.email "shorts-automation[bot]@users.noreply.github.com"
            git add storage/history.json
            git commit -m "Update Shorts publishing history"
            git push
          fi

      - name: Save rendered test video
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: shorts-dry-run
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 3
