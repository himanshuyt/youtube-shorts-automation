name: Daily Shorts

on:
  workflow_dispatch:
  schedule:
    # 18:30 Asia/Kolkata (UTC+5:30). GitHub may delay scheduled workflows.
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and upload Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          PUBLISH_PUBLIC: ${{ vars.PUBLISH_PUBLIC }}
        run: python main.py

      - name: Commit topic history
        if: always()
        run: |
          if ! git diff --quiet -- storage/history.json; then
            git config user.name "shorts-automation[bot]"
            git config user.email "shorts-automation[bot]@users.noreply.github.com"
            git add storage/history.json
            git commit -m "Update Shorts publishing history"
            git push
          fi
